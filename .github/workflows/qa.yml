name: ChuanhoaBang scoped QA
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install core and test requirements
        run: python -m pip install '.[test]'
      - name: Run focused structural tests
        run: python -m pytest -q tests/
      - name: CLI import smoke
        run: python -m chuanhoabang --help
