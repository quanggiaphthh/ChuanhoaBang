name: ChuanhoaBang scoped QA
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-preview:
    name: build canonical preview wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.4'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked core and test requirements
        run: uv sync --locked --extra test
      - name: Build twice and smoke-test canonical wheel
        run: uv run --locked python .github/scripts/wheel_smoke.py --output-dir work/release-candidate
      - name: Preserve technical-preview wheel and manifest
        uses: actions/upload-artifact@v4
        with:
          name: chuanhoabang-preview-${{ github.sha }}
          path: work/release-candidate/
          if-no-files-found: error
          retention-days: 14

  python-tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: build-preview
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.12'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download canonical preview wheel and manifest
        uses: actions/download-artifact@v4
        with:
          name: chuanhoabang-preview-${{ github.sha }}
          path: work/release-candidate
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.4'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked core and test requirements
        run: uv sync --locked --extra test
      - name: Run focused structural tests
        run: uv run --locked python -m pytest -q tests/
      - name: CLI import smoke
        run: uv run --locked python -m chuanhoabang --help
      - name: Install and smoke-test canonical preview wheel
        run: uv run --locked python .github/scripts/wheel_smoke.py --candidate-dir work/release-candidate
      - name: Build and verify a target-specific offline wheelhouse
        run: python .github/scripts/offline_bundle_smoke.py --candidate-dir work/release-candidate --output-dir work/offline-bundle
      - name: Rebuild canonical wheel on an independent runner
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: uv run --locked python .github/scripts/wheel_smoke.py --output-dir work/independent-rebuild
      - name: Compare independent wheel build with canonical artifact
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          canonical = json.loads(Path("work/release-candidate/release-manifest.json").read_text())
          rebuilt = json.loads(Path("work/independent-rebuild/release-manifest.json").read_text())
          assert canonical["source"]["commit"] == rebuilt["source"]["commit"]
          assert canonical["source"]["uv_lock_sha256"] == rebuilt["source"]["uv_lock_sha256"]
          assert canonical["artifact"]["filename"] == rebuilt["artifact"]["filename"]
          assert canonical["artifact"]["sha256"] == rebuilt["artifact"]["sha256"]
          print("Independent runner wheel SHA-256 matches canonical artifact:", canonical["artifact"]["sha256"])
          PY
      - name: Preserve offline wheelhouse and install manifest
        uses: actions/upload-artifact@v4
        with:
          name: chuanhoabang-offline-${{ runner.os }}-py${{ matrix.python-version }}-${{ github.sha }}
          path: work/offline-bundle/
          if-no-files-found: error
          retention-days: 14
