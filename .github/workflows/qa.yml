name: ChuanhoaBang scoped QA
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.12'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.4'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked core and test requirements
        run: uv sync --locked --extra test
      - name: Run focused structural tests
        run: uv run --locked python -m pytest -q tests/
      - name: CLI import smoke
        run: uv run --locked python -m chuanhoabang --help
      - name: Build and install wheel in isolated target
        run: uv run --locked python .github/scripts/wheel_smoke.py
